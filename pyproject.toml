[project]
name = "zinvyl-crewai-authorized-buyer"
version = "0.1.0"
description = "A governed CrewAI template for matching and purchasing one fixed-scope Zinvyl service with explicit delegated authority."
authors = [{ name = "G.B. Industry LLC d/b/a Zinvyl", email = "gabriel@zinvyl.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai[tools]>=1.15.28,<2.0.0",
  "mcp>=1.0.0",
]

[project.scripts]
zinvyl_buyer = "zinvyl_crewai_buyer.main:run"
zinvyl_preview = "zinvyl_crewai_buyer.main:preview"
zinvyl_buy = "zinvyl_crewai_buyer.main:buy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
pythonpath = ["src"]

